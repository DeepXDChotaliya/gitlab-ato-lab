<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}VulnBank Lab{% endblock %}</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --danger: #f85149;
      --ok: #3fb950;
      --mono: 'SFMono-Regular', Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    nav {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a { color: var(--text); text-decoration: none; margin-right: 16px; font-size: 14px; }
    nav a:hover { color: var(--accent); }
    .brand { font-weight: 700; color: var(--accent); font-family: var(--mono); }
    .wrap { max-width: 560px; margin: 48px auto; padding: 0 20px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
    }
    h1 { font-size: 20px; margin-top: 0; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
    input {
      width: 100%;
      padding: 9px 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #04101f;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { opacity: 0.9; }
    .muted { color: var(--muted); font-size: 13px; }
    .flash {
      background: rgba(88,166,255,0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--mono);
    }
    .badge.vuln { background: rgba(248,81,73,0.15); color: var(--danger); border: 1px solid var(--danger); }
    .badge.patched { background: rgba(63,185,80,0.15); color: var(--ok); border: 1px solid var(--ok); }
    a.link { color: var(--accent); }
    pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      font-size: 12.5px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  </style>
</head>
<body>
  <nav>
    <div><span class="brand">VulnBank</span> <span class="muted">// password-reset lab</span></div>
    <div>
      {% if session.get('user_id') %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </div>
  </nav>
  <div class="wrap">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
